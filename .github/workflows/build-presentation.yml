name: Build student presentation
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/build_presentation.py'
      - '.github/workflows/build-presentation.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install python-pptx
      - name: Build editable PowerPoint
        run: python scripts/build_presentation.py
      - name: Commit PowerPoint deliverable
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deliverables/Game_Glitch_Investigator_AI_CodePath_Final_Presentation.pptx
          if ! git diff --cached --quiet; then
            git commit -m "docs: upload generated CodePath final presentation"
            git push
          fi
